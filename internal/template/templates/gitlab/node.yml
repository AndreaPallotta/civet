image: node:20-alpine

stages:
  - install
  - lint
  - test
  - build

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

install:
  stage: install
  script:
    - npm ci --cache .npm --prefer-offline
  interruptible: true

lint:
  stage: lint
  script:
    - npm run lint
  needs:
    - install
  interruptible: true

test:
  stage: test
  script:
    - npm test
  needs:
    - install
  interruptible: true
  artifacts:
    paths:
      - coverage/
    expire_in: 1 week

build:
  stage: build
  script:
    - npm run build
  needs:
    - install
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
