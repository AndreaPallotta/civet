image: python:3.12-slim

stages:
  - lint
  - test

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip

lint:
  stage: lint
  script:
    - pip install flake8
    - flake8 .
  interruptible: true

test:
  stage: test
  script:
    - pip install pytest pytest-cov
    - pytest --cov=./
  interruptible: true
  artifacts:
    paths:
      - .coverage
    expire_in: 1 week
